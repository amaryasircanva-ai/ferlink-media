<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asgeonline - FERLINK</title>
    
    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: #e0f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #0288d1;
            color: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Tombol Kembali ke Halaman Utama FERLINK */
        .btn-back-ferlink {
            background: #ffffff;
            color: #0288d1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            border: 2px solid #b3e5fc;
        }
        .btn-back-ferlink:hover {
            background: #e1f5fe;
            transform: translateX(-3px);
        }

        h1 { font-size: 22px; font-weight: 700; }

        .nav-tabs { display: flex; gap: 10px; }
        .tab-btn {
            background: #03a9f4;
            border: 2px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #ffeb3b;
            color: #d84315;
            border-color: #ff9800;
        }

        #main-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Panel Kontrol Garis */
        #astro-control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 20px;
            border: 3px solid #ab47bc;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 280px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            color: #4a148c;
            text-align: center;
            margin-bottom: 2px;
        }

        .astro-btn {
            background: #f3e5f5;
            border: 2px solid #ab47bc;
            color: #4a148c;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .astro-btn.active {
            background: #ab47bc;
            color: white;
        }

        #instruction-box {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 25px;
            border-radius: 25px;
            border: 3px solid #0288d1;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
        }

        /* Copyright Pojok Kiri Bawah */
        #copyright-tag {
            position: absolute;
            bottom: 12px;
            left: 15px;
            background: rgba(255, 255, 255, 0.85);
            color: #333333;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #b0bec5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 1000;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            header { padding: 10px 15px; }
            h1 { font-size: 18px; }
            .btn-back-ferlink { font-size: 12px; padding: 6px 12px; }
            .tab-btn { font-size: 13px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <!-- Tombol Navigasi Kembali Ke IPAS / Beranda -->
            <a href="../ipas.html" class="btn-back-ferlink">
                ⬅️ Kembali ke IPAS
            </a>
            <h1>🌍 Asgeonline</h1>
        </div>
        
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-geo" onclick="showGeografis()">1. Letak Geografis</button>
            <button class="tab-btn" id="btn-astro" onclick="showAstronomis()">2. Letak Astronomis</button>
        </div>
    </header>

    <div id="main-container">
        <div id="map"></div>

        <!-- COPYRIGHT TAG -->
        <div id="copyright-tag">
            © 2026 Ferlink by Robie Ferli. All Rights Reserved.
        </div>

        <!-- Panel Filter Garis Astronomis -->
        <div id="astro-control-panel">
            <div class="panel-title">Kontrol Garis Astronomis</div>
            
            <button class="astro-btn active" id="toggle-grid" onclick="toggleLine('grid')">
                <span>🌐 Jaring Lintang & Bujur Dunia</span>
                <span id="st-grid">ON</span>
            </button>
            
            <button class="astro-btn active" id="toggle-khatulistiwa" onclick="toggleLine('khatulistiwa')">
                <span>🔴 Garis Khatulistiwa (0°)</span>
                <span id="st-khatulistiwa">ON</span>
            </button>

            <button class="astro-btn active" id="toggle-batas" onclick="toggleLine('batas')">
                <span>⭐ Batas Indonesia (6°LU-11°LS & 95°BT-141°BT)</span>
                <span id="st-batas">ON</span>
            </button>
        </div>

        <div id="instruction-box">Klik penanda di peta untuk mempelajari wilayahnya! 💡</div>
    </div>

    <!-- Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi Peta
        const map = L.map('map').setView([-2.5489, 118.0149], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 10,
            minZoom: 2,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Group Layers
        const geoGroup = L.layerGroup().addTo(map);
        const gridGroup = L.layerGroup();
        const khatulistiwaGroup = L.layerGroup();
        const batasGroup = L.layerGroup();

        // 1. Data Penanda Geografis
        const geoMarkers = [
            { lat: 25.0, lng: 100.0, label: "🌏 BENUA ASIA", desc: "Indonesia berbatasan dengan Benua Asia di sebelah utara." },
            { lat: -25.0, lng: 135.0, label: "🦘 BENUA AUSTRALIA", desc: "Indonesia berbatasan dengan Benua Australia di sebelah selatan." },
            { lat: -12.0, lng: 90.0, label: "🌊 SAMUDRA HINDIA", desc: "Samudra Hindia mengapit Indonesia di sebelah barat dan selatan." },
            { lat: 5.0, lng: 140.0, label: "🌊 SAMUDRA PASIFIK", desc: "Samudra Pasifik mengapit Indonesia di sebelah timur laut." }
        ];

        geoMarkers.forEach(item => {
            const marker = L.marker([item.lat, item.lng]).addTo(geoGroup);
            marker.bindPopup(`<b>${item.label}</b><br>${item.desc}`);
        });

        // 2. Garis Jaring-Jaring Global
        for (let lat = -80; lat <= 80; lat += 10) {
            if (lat !== 0) {
                const labelText = lat > 0 ? `${lat}° LU` : `${Math.abs(lat)}° LS`;
                L.polyline([[lat, -180], [lat, 180]], {color: '#78909c', weight: 1, dashArray: '4, 4'})
                    .addTo(gridGroup)
                    .bindTooltip(labelText, {permanent: false, direction: 'right'});
            }
        }

        for (let lng = -180; lng <= 180; lng += 10) {
            const labelText = lng >= 0 ? `${lng}° BT` : `${Math.abs(lng)}° BB`;
            L.polyline([[-90, lng], [90, lng]], {color: '#78909c', weight: 1, dashArray: '4, 4'})
                .addTo(gridGroup)
                .bindTooltip(labelText, {permanent: false, direction: 'top'});
        }

        // 3. Garis Khatulistiwa (0°)
        L.polyline([[0, -180], [0, 180]], {color: '#d50000', weight: 4})
            .addTo(khatulistiwaGroup)
            .bindTooltip("Garis Khatulistiwa (0°)", {permanent: true, direction: "top"});

        // 4. Garis Batas Astronomis Indonesia
        L.polyline([[6, 85], [6, 150]], {color: '#8e24aa', weight: 3, dashArray: '6, 6'}).addTo(batasGroup)
            .bindTooltip("6° LU (Batas Utara Indonesia)", {permanent: true, direction: "top"});
        L.polyline([[-11, 85], [-11, 150]], {color: '#8e24aa', weight: 3, dashArray: '6, 6'}).addTo(batasGroup)
            .bindTooltip("11° LS (Batas Selatan Indonesia)", {permanent: true, direction: "bottom"});

        L.polyline([[15, 95], [-20, 95]], {color: '#1e88e5', weight: 3, dashArray: '6, 6'}).addTo(batasGroup)
            .bindTooltip("95° BT (Batas Barat)", {permanent: true, direction: "left"});
        L.polyline([[15, 141], [-20, 141]], {color: '#1e88e5', weight: 3, dashArray: '6, 6'}).addTo(batasGroup)
            .bindTooltip("141° BT (Batas Timur)", {permanent: true, direction: "right"});

        // State Tombol
        const state = { grid: true, khatulistiwa: true, batas: true };

        // Fungsi Toggle Garis
        function toggleLine(type) {
            state[type] = !state[type];
            const btn = document.getElementById(`toggle-${type}`);
            const statusText = document.getElementById(`st-${type}`);

            if (state[type]) {
                btn.classList.add('active');
                statusText.innerText = "ON";
                if (type === 'grid') map.addLayer(gridGroup);
                if (type === 'khatulistiwa') map.addLayer(khatulistiwaGroup);
                if (type === 'batas') map.addLayer(batasGroup);
            } else {
                btn.classList.remove('active');
                statusText.innerText = "OFF";
                if (type === 'grid') map.removeLayer(gridGroup);
                if (type === 'khatulistiwa') map.removeLayer(khatulistiwaGroup);
                if (type === 'batas') map.removeLayer(batasGroup);
            }
        }

        // Navigasi Mode
        function showGeografis() {
            document.getElementById('btn-geo').classList.add('active');
            document.getElementById('btn-astro').classList.remove('active');
            document.getElementById('astro-control-panel').style.display = 'none';

            map.removeLayer(gridGroup);
            map.removeLayer(khatulistiwaGroup);
            map.removeLayer(batasGroup);
            map.addLayer(geoGroup);

            map.setView([-2.5489, 118.0149], 4);
            document.getElementById('instruction-box').innerText = "Klik penanda Benua dan Samudra pada peta!";
        }

        function showAstronomis() {
            document.getElementById('btn-astro').classList.add('active');
            document.getElementById('btn-geo').classList.remove('active');
            document.getElementById('astro-control-panel').style.display = 'flex';

            map.removeLayer(geoGroup);
            if (state.grid) map.addLayer(gridGroup);
            if (state.khatulistiwa) map.addLayer(khatulistiwaGroup);
            if (state.batas) map.addLayer(batasGroup);

            map.setView([-2.5489, 118.0149], 4);
            document.getElementById('instruction-box').innerText = "Nyalakan jaring bumi dan garis batas untuk melihat posisi astronomis Indonesia!";
        }
    </script>
</body>
</html>
