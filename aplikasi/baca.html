<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dunia Membaca Ceria - FERLINK Kids</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
    color: #333;
    padding: 20px;
    min-height: 100vh;
  }

  /* Tombol Mengambang Kembali ke Beranda */
  .floating-home {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #ffffff;
    color: #ff5252;
    font-family: 'Fredoka One', cursive;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 50px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    border: 4px solid #ff5252;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    z-index: 1000;
    transition: all 0.2s ease;
  }
  .floating-home:hover {
    background: #ff5252;
    color: white;
    transform: scale(1.08);
  }
  .floating-home:active {
    transform: translateY(2px);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 35px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    border: 6px solid #ffeb3b;
    position: relative;
    overflow: hidden;
    margin-top: 20px; /* Jarak agar tidak tertutup tombol mengambang di layar kecil */
  }
  
  /* Hiasan Latar Belakang Ceria */
  .container::before {
    content: "⭐ ☁️ 🎈 🌟 🚀 🎨";
    position: absolute;
    top: 15px;
    right: 25px;
    font-size: 20px;
    opacity: 0.6;
    letter-spacing: 5px;
  }

  header {
    text-align: center;
    margin-bottom: 25px;
  }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 38px;
    background: linear-gradient(90deg, #ff5252, #ff9800, #4caf50, #2196f3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
  }
  header p {
    color: #666;
    font-size: 16px;
    font-weight: 700;
  }
  
  .score-badge {
    display: inline-block;
    background: #fff9c4;
    color: #f57f17;
    font-family: 'Fredoka One', cursive;
    padding: 8px 22px;
    border-radius: 25px;
    margin-top: 12px;
    font-size: 20px;
    border: 3px dashed #ffd54f;
    box-shadow: 0 4px 10px rgba(255,235,59,0.3);
  }

  /* Navigasi Tab Menu yang Ramah Anak */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .tab-btn {
    font-family: 'Fredoka One', cursive;
    background: #e0f7fa;
    border: 3px solid #b2ebf2;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #00838f;
    box-shadow: 0 5px 0 #b2ebf2;
  }
  .tab-btn:hover {
    transform: translateY(-3px);
    background: #b2ebf2;
  }
  .tab-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #b2ebf2;
  }
  .tab-btn.active {
    background: #ff7043;
    color: white;
    border-color: #f4511e;
    box-shadow: 0 5px 0 #d84315;
  }

  .section {
    display: none;
    animation: fadeIn 0.4s ease-in-out;
  }
  .section.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Grid Huruf Pelangi */
  .grid-letters {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
    gap: 15px;
  }
  .card-item {
    font-family: 'Fredoka One', cursive;
    background: #fff;
    border: 4px solid #ffca28;
    border-radius: 22px;
    padding: 15px 5px;
    text-align: center;
    font-size: 32px;
    color: #e91e63;
    cursor: pointer;
    box-shadow: 0 6px 0 #ffb300;
    transition: all 0.15s ease;
    user-select: none;
  }
  .card-item:hover {
    transform: scale(1.1) rotate(3deg);
    background: #fffde7;
  }
  .card-item:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #ffb300;
  }

  /* Grid Kartu Kata Ceria */
  .grid-words {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .word-card {
    background: #fff8e1;
    border: 4px solid #ffb74d;
    border-radius: 25px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 8px 0 #ffa726;
    transition: transform 0.2s;
  }
  .word-card:hover {
    transform: translateY(-5px);
  }
  .word-icon {
    font-size: 55px;
    margin-bottom: 8px;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
  }
  .word-text {
    font-family: 'Fredoka One', cursive;
    font-size: 34px;
    letter-spacing: 2px;
    margin-bottom: 15px;
  }
  .syllable-1 { color: #e91e63; }
  .syllable-2 { color: #3f51b5; }

  .btn-group {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .btn-action {
    font-family: 'Fredoka One', cursive;
    background: #26a69a;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 4px 0 #00897b;
    transition: 0.1s;
  }
  .btn-action:hover {
    background: #00897b;
  }
  .btn-action:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #00897b;
  }
  .btn-eja {
    background: #ab47bc;
    box-shadow: 0 4px 0 #8e24aa;
  }
  .btn-eja:hover {
    background: #8e24aa;
  }

  /* Cerita Kartun */
  .story-card {
    background: #e8f5e9;
    border: 4px solid #81c784;
    border-radius: 25px;
    padding: 20px 25px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 6px 0 #66bb6a;
  }
  .story-icon {
    font-size: 55px;
  }
  .story-text {
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    color: #2e7d32;
    line-height: 1.4;
  }

  /* Mini Game Box Ceria */
  .game-box {
    background: #fce4ec;
    border: 4px dashed #f06292;
    border-radius: 30px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 8px 0 #ec407a;
  }
  .game-target {
    font-size: 85px;
    margin-bottom: 10px;
    animation: bounce 1.5s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .drop-zone {
    min-height: 70px;
    border: 3px solid #f8bbd0;
    background: white;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 25px;
    padding: 10px;
  }
  .syllable-chip {
    font-family: 'Fredoka One', cursive;
    background: #ff5252;
    color: white;
    font-size: 26px;
    padding: 12px 24px;
    border-radius: 18px;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 5px 0 #d32f2f;
    transition: 0.1s;
  }
  .syllable-chip:hover {
    transform: scale(1.05);
  }
  .syllable-chip:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #d32f2f;
  }

  .sound-hint {
    margin-top: 30px;
    text-align: center;
    font-size: 15px;
    color: #00838f;
    font-weight: 700;
    background: #e0f7fa;
    padding: 12px;
    border-radius: 18px;
    border: 2px dashed #80deea;
  }
</style>
</head>
<body>

<!-- Tombol Navigasi Mengambang Kembali -->
<!-- Ubah "bahasa_indonesia.html" menjadi "index.html" jika ingin langsung ke beranda utama -->
<a href="../index.html" class="floating-home">
  <span>🏠</span> Kembali
</a>

<div class="container">
  <header>
    <h1>🌈 Dunia Membaca Ceria 📖</h1>
    <p>Ayo Belajar Mengeja dan Membaca Sambil Bermain! ✨</p>
    <div class="score-badge">⭐ Bintang Hebat: <span id="starCount">0</span></div>
  </header>

  <!-- Navigasi Tab Menu -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('huruf')">🔤 Abjad A-Z</button>
    <button class="tab-btn" onclick="switchTab('suku-kata')">🧩 Suku Kata</button>
    <button class="tab-btn" onclick="switchTab('kata')">📝 Kata Seru</button>
    <button class="tab-btn" onclick="switchTab('cerita')">📚 Kalimat Asyik</button>
    <button class="tab-btn" onclick="switchTab('game')">🎮 Game Susun Kata</button>
  </div>

  <!-- Bagian 1: Abjad A-Z -->
  <div id="huruf" class="section active">
    <div class="grid-letters" id="lettersGrid"></div>
  </div>

  <!-- Bagian 2: Suku Kata -->
  <div id="suku-kata" class="section">
    <div class="grid-letters" id="syllablesGrid"></div>
  </div>

  <!-- Bagian 3: Kata & Mengeja -->
  <div id="kata" class="section">
    <div class="grid-words" id="wordsGrid"></div>
  </div>

  <!-- Bagian 4: Kalimat/Cerita Pendek -->
  <div id="cerita" class="section">
    <div id="storiesContainer"></div>
  </div>

  <!-- Bagian 5: Mini Game -->
  <div id="game" class="section">
    <div class="game-box">
      <div class="game-target" id="gameEmoji">👕</div>
      <p style="font-family: 'Fredoka One', cursive; font-size: 18px; margin-bottom: 20px; color: #880e4f;">Klik kotak suku kata di bawah untuk menyusun nama gambar di atas!</p>
      
      <div class="drop-zone" id="answerZone">
        <span style="color:#aaa; font-style:italic; font-family:sans-serif;">Susun di sini ya...</span>
      </div>

      <div class="btn-group" id="optionsZone" style="justify-content: center; margin-bottom: 20px; flex-wrap: wrap;"></div>

      <div>
        <button class="btn-action" style="background:#ffca28; color:#333; box-shadow:0 4px 0 #ffa000; font-size:16px; padding:12px 24px;" onclick="resetGame()">🔄 Ganti Soal Lain</button>
      </div>
    </div>
  </div>

  <div class="sound-hint">💡 Sentuh atau klik huruf, kata, atau tombol suara untuk mendengarkan audionya! 🔊</div>
</div>

<script>
  let stars = 0;

  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  const konsonan = ['B', 'C', 'D', 'K', 'M', 'N', 'P', 'S', 'T'];
  const vokal = ['a', 'i', 'u', 'e', 'o'];
  const sukuKata = [];
  konsonan.forEach(k => {
    vokal.forEach(v => sukuKata.push(k + v));
  });

  const daftarKata = [
    { icon: '👕', s1: 'ba', s2: 'ju', full: 'baju', eja: 'b a, ba... j u, ju... baju' },
    { icon: '⚽', s1: 'bo', s2: 'la', full: 'bola', eja: 'b o, bo... l a, la... bola' },
    { icon: '📚', s1: 'bu', s2: 'ku', full: 'buku', eja: 'b u, bu... k u, ku... buku' },
    { icon: '🐎', s1: 'ku', s2: 'da', full: 'kuda', eja: 'k u, ku... d a, da... kuda' },
    { icon: '👁️', s1: 'ma', s2: 'ta', full: 'mata', eja: 'm a, ma... t a, ta... mata' },
    { icon: '🧹', s1: 'sa', s2: 'pu', full: 'sapu', eja: 's a, sa... p u, pu... sapu' },
    { icon: '🍞', s1: 'ro', s2: 'ti', full: 'roti', eja: 'r o, ro... t i, ti... roti' },
    { icon: '🥛', s1: 'su', s2: 'su', full: 'susu', eja: 's u, su... s u, su... susu' }
  ];

  const daftarCerita = [
    { icon: '👦', teks: 'Budi suka bola.' },
    { icon: '🐱', teks: 'Ini kucing saya.' },
    { icon: '🍎', teks: 'Ibu beli apel manis.' },
    { icon: '🏫', teks: 'Saya rajin ke sekolah.' }
  ];

  function bicara(teks, speed = 0.8) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(teks);
      utterance.lang = 'id-ID';
      utterance.rate = speed;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Render Abjad
  const lettersGrid = document.getElementById('lettersGrid');
  alphabet.forEach(letter => {
    const card = document.createElement('div');
    card.className = 'card-item';
    card.innerText = letter;
    card.onclick = () => bicara(letter);
    lettersGrid.appendChild(card);
  });

  // Render Suku Kata
  const syllablesGrid = document.getElementById('syllablesGrid');
  sukuKata.forEach(sk => {
    const card = document.createElement('div');
    card.className = 'card-item';
    card.style.borderColor = '#26a69a';
    card.style.color = '#00796b';
    card.style.boxShadow = '0 6px 0 #00897b';
    card.innerText = sk;
    card.onclick = () => bicara(sk);
    syllablesGrid.appendChild(card);
  });

  // Render Kata
  const wordsGrid = document.getElementById('wordsGrid');
  daftarKata.forEach(item => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.innerHTML = `
      <div class="word-icon">${item.icon}</div>
      <div class="word-text">
        <span class="syllable-1">${item.s1}</span><span class="syllable-2">${item.s2}</span>
      </div>
      <div class="btn-group">
        <button class="btn-action" onclick="bicara('${item.full}')">🔊 Baca</button>
        <button class="btn-action btn-eja" onclick="bicara('${item.eja}', 0.6)">🔤 Eja</button>
      </div>
    `;
    wordsGrid.appendChild(card);
  });

  // Render Cerita
  const storiesContainer = document.getElementById('storiesContainer');
  daftarCerita.forEach(item => {
    const card = document.createElement('div');
    card.className = 'story-card';
    card.innerHTML = `
      <div class="story-icon">${item.icon}</div>
      <div class="story-text">${item.teks}</div>
      <button class="btn-action" style="background:#43a047; box-shadow:0 4px 0 #2e7d32; margin-left:auto; padding:12px 18px;" onclick="bicara('${item.teks}')">🔊 Dengarkan</button>
    `;
    storiesContainer.appendChild(card);
  });

  // Game Logic
  let currentGameItem = null;
  let currentAnswer = [];

  function initGame() {
    currentAnswer = [];
    document.getElementById('answerZone').innerHTML = '<span style="color:#aaa; font-style:italic; font-family:sans-serif;">Susun di sini ya...</span>';
    
    currentGameItem = daftarKata[Math.floor(Math.random() * daftarKata.length)];
    document.getElementById('gameEmoji').innerText = currentGameItem.icon;

    let options = [currentGameItem.s1, currentGameItem.s2];
    while(options.length < 4) {
      let randomSK = sukuKata[Math.floor(Math.random() * sukuKata.length)].toLowerCase();
      if(!options.includes(randomSK)) options.push(randomSK);
    }

    options.sort(() => Math.random() - 0.5);

    const optionsZone = document.getElementById('optionsZone');
    optionsZone.innerHTML = '';
    options.forEach(opt => {
      const chip = document.createElement('div');
      chip.className = 'syllable-chip';
      chip.innerText = opt;
      chip.onclick = () => selectSyllable(opt, chip);
      optionsZone.appendChild(chip);
    });
  }

  function selectSyllable(sk, element) {
    bicara(sk);
    currentAnswer.push(sk);
    
    const answerZone = document.getElementById('answerZone');
    if(currentAnswer.length === 1) answerZone.innerHTML = '';

    const chip = document.createElement('div');
    chip.className = 'syllable-chip';
    chip.style.background = '#3f51b5';
    chip.style.boxShadow = '0 5px 0 #303f9f';
    chip.innerText = sk;
    answerZone.appendChild(chip);

    element.style.visibility = 'hidden';

    if(currentAnswer.length === 2) {
      let combined = currentAnswer.join('');
      if(combined === currentGameItem.full) {
        setTimeout(() => {
          bicara(`Hore! Benar, jawabannya adalah ${currentGameItem.full}`);
          stars += 10;
          document.getElementById('starCount').innerText = stars;
          alert('🎉 HORE! Kamu Hebat! +10 Bintang ⭐');
          initGame();
        }, 500);
      } else {
        setTimeout(() => {
          bicara('Coba lagi ya!');
          alert('❌ Ups, kurang tepat! Ayo coba lagi ya.');
          initGame();
        }, 500);
      }
    }
  }

  function resetGame() {
    initGame();
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(tabId).classList.add('active');

    if(tabId === 'game') {
      initGame();
    }
  }
</script>

</body>
</html>
